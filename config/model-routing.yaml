# EU-only LLM provider chain.
#
# Policy: every provider MUST have an EU region. CI (main.py validate and
# compliance-check workflow) fails the build if a non-EU region appears here.
# Cloud (saas) providers require an EU DPA before use — see docs/dpia-ai-processing.md.
# A self-hosted provider has NO third-party DPA because there is no exporter: JOL is both
# controller and processor. Its compliance basis is the jol-llm ISO 27001 / GDPR Art. 32
# evidence and the two-factor mTLS transport enforced by check_provider_transport in main.py.

default: primary

providers:
  - name: primary
    vendor: mistral              # EU vendor (Paris, FR)
    region: eu
    # Pinned identifier — never use *-latest aliases (audit finding H2).
    # Re-pin deliberately after evaluating each new model release.
    model: mistral-large-2411
    context_length: 128000       # verified >= 64000 by main.py validate
    api_key_env: HERMES_PRIMARY_API_KEY
    timeout_s: 60
    max_retries: 2

  - name: fallback
    vendor: ovh-ai               # EU-hosted endpoint (France)
    region: eu
    model: llama-3.1-70b-instruct
    context_length: 128000       # verified >= 64000 by main.py validate
    api_key_env: HERMES_FALLBACK_API_KEY
    timeout_s: 90
    max_retries: 1

  - name: self_hosted_lt01
    kind: self-hosted            # validated by check_provider_transport (main.py)
    vendor: jol-llm              # air-gapped Ollama on bare-metal llm-prod-lt01 (Lithuania, EU)
    region: eu                   # EU by construction; no data crosses the border
    base_url: https://llm.jol.internal:8443/v1   # mTLS + Bearer (OpenAI-compatible subset)
    model: qwen3-32b-q8_0        # pinned registry name — never *-latest (audit H2)
    context_length: 32768        # native Qwen3-32B window; no YaRN (>=32000 self-hosted floor)
    api_key_env: HERMES_SELF_HOSTED_API_KEY
    tls_client_cert_env: HERMES_SELF_HOSTED_TLS_CERT   # mTLS client cert
    tls_client_key_env: HERMES_SELF_HOSTED_TLS_KEY      # mTLS client key
    tls_ca_cert_env: HERMES_SELF_HOSTED_TLS_CA          # internal CA pin
    timeout_s: 600               # single-slot CPU ~1.4 tok/s; generous so it degrades, not flakes
    max_retries: 0               # retry would just re-queue a busy slot

routing:
  # Data-class routing (Phase 3): a request is served only by the providers cleared
  # for its data classification. This is enforced by check_routing_policy in main.py —
  # routing a sensitive class to a SaaS provider, an undeclared provider/class, an
  # ambiguous double-routed class, or a blocked class all fail the build.
  strategy: data_class
  chains:
    - name: sensitive
      data_classes: [personal_data, special_category]
      providers: [self_hosted_lt01]   # fail-closed: on-prem only, data never leaves lt01
      # No fallback to SaaS: if lt01 is unavailable the request degrades gracefully
      # (agent-policy escalation provider_chain_exhausted), it is NOT exported.
    - name: standard
      data_classes: [operational_telemetry]
      providers: [primary, fallback]   # EU SaaS failover chain
      fallback_on: [timeout, rate_limited, server_error]
  default_chain: standard
  # Never sent to ANY provider, self-hosted included.
  blocked_data_classes:
    - credentials
    - payment_data
