name: Compliance check

on:
  # Manual-only: GitHub Actions minutes are limited (audit constraint 2026-09-29).
  # EU routing + retention coverage are already asserted by `main.py validate`.
  # Run on-demand via: gh workflow run compliance-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    name: EU routing + retention coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: EU-only routing assertion
        run: |
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("config/model-routing.yaml"))
          bad = [p["name"] for p in cfg["providers"]
                 if str(p.get("region", "")).lower() not in {"eu", "eu-central", "eu-west"}]
          assert not bad, f"non-EU providers: {bad}"
          print("EU-only routing OK")
          PY

      - name: Retention coverage assertion
        run: |
          python - <<'PY'
          import yaml
          schema = yaml.safe_load(open("memory/schema.yaml"))
          policy = yaml.safe_load(open("memory/retention-policy.yaml"))
          have = {ns["namespace"] for ns in schema["namespaces"]}
          covered = set(policy.get("retention", {}))
          missing = have - covered
          assert not missing, f"namespaces without retention: {missing}"
          print("retention coverage OK")
          PY
