name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Python lint + skill tests + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate config, skills, memory schema
        run: python main.py validate

      - name: Ruff
        run: python -m ruff check .

      - name: yamllint
        run: python -m yamllint -c .yamllint config/ memory/

      - name: Test suite
        run: python -m pytest

      - name: Secret scan (gitleaks)
        # Open-source gitleaks CLI — no license required (gitleaks-action v2
        # is commercial and requires a GITLEAKS_LICENSE secret for orgs).
        # Version pinned to match .pre-commit-config.yaml (audit finding M1).
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/scan"
          zricethezav/gitleaks:v8.30.0
          detect --source /scan --no-banner --redact
          --exit-code 1 -v

