name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Python lint + skill tests + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate config, skills, memory schema
        run: python main.py validate

      - name: Ruff
        run: python -m ruff check .

      - name: yamllint
        run: python -m yamllint -c .yamllint config/ memory/

      - name: Test suite
        run: python -m pytest

      - name: Secret scan (gitleaks)
        # Open-source gitleaks CLI — no license required (gitleaks-action v2
        # is commercial and requires a GITLEAKS_LICENSE secret for orgs).
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/scan"
          zricethezav/gitleaks:latest
          detect --source /scan --no-banner --redact
          --exit-code 1 -v

  qodana:
    name: Qodana static analysis
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        env:
          # Requires the QODANA_TOKEN repository secret (Qodana Cloud project).
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
