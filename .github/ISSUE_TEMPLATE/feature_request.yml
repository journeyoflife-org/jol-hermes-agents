name: Feature request
description: A new skill, gateway, or capability for Hermes.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: What recurring work or gap should this solve?
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - infrastructure
        - operations
        - bitrix
        - platform/config
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Expected risk level
      description: Determines confirmation gates (see config/agent-policy.yaml).
      options:
        - low (read-only)
        - medium (announced actions)
        - high (mutating/destructive)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the skill works? Include the expected output format.
    validations:
      required: true
