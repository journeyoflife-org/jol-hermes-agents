# Qodana — Static Analysis Configuration
# https://www.jetbrains.com/help/qodana/
#
# CI job removed (cost decision, commit 7b49384); CodeQL covers CI static
# analysis. This file is kept for on-demand local/IDE scans only.
# Run locally:  qodana scan
# PyCharm:      Tools → Qodana → Try Code Analysis with Qodana
---
version: "1.0"

# CLI 2026.x+: pin version to match CLI (update when upgrading CLI)
linter: jetbrains/qodana-python:2026.1

profile:
  name: qodana.recommended

include:
  - name: CheckDependencyLicenses
  - name: PyTypeChecker
  - name: PyUnresolvedReferences
  - name: PyShadowingNames
  - name: PyRedundantParentheses
  - name: PyUnusedLocal

exclude:
  - name: All
    paths:
      - .venv
      - .git
      - __pycache__
      - .pytest_cache
      - .mypy_cache
      - htmlcov

# Fail the quality gate if new issues exceed threshold
failThreshold: 0
